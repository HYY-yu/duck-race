<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>游戏资产验收 / Game asset review</title>
<style>body{margin:0;background:#edf0e9;font:15px system-ui;color:#27463b}header{position:absolute;padding:20px}h1{font-size:21px}button{padding:8px 16px;margin-right:6px}#status{max-width:850px}canvas{display:block}</style>
<header><h1>游戏资产验收 / Game asset review</h1><button id="ducks">鸭子挂件 / Duck accessories</button><button id="scarf">围巾多视角 / Scarf views</button><button id="audience">观众 / Audience</button><button id="scenery">树木、兔子与飞鸟 / Scenery</button><p id="status">加载中 / Loading…</p></header>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from 'three/addons/controls/OrbitControls.js';import{GeneratedAssets}from '/src/generated-assets.ts';
const assets=new GeneratedAssets();await assets.load();document.getElementById('status').textContent=`已加载 / Loaded ${assets.diagnostics.loaded.length}/13 · 失败 / Failed ${assets.diagnostics.failed.length}`;
const scene=new THREE.Scene();scene.background=new THREE.Color('#edf0e9');const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0xb6c5ac,2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(-3,8,5);scene.add(sun);const camera=new THREE.PerspectiveCamera(38,1,.1,100),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;const group=new THREE.Group();scene.add(group);
function view(mode){group.clear();controls.target.set(0,1,0);camera.position.set(9,6,14);if(mode==='ducks'){for(let i=0;i<5;i++){const duck=assets.duck(['#FED733','#e98566','#76b5b2','#a5a0ce','#96bd76'][i],i);duck.position.x=(i-2)*2.6;group.add(duck);}}else if(mode==='scarf'){camera.position.set(0,4,11);for(let i=0;i<3;i++){const duck=assets.duck('#96bd76',4);duck.position.x=(i-1)*3;duck.rotation.y=[0,Math.PI/2,Math.PI][i];group.add(duck);}}else if(mode==='audience'){for(const [i,id]of ['audience-white-rabbit','audience-bear','audience-fox','audience-gray-rabbit'].entries()){const m=assets.make(id,{height:2.8});m.position.x=(i-1.5)*2;group.add(m);}}else{for(const [i,id]of ['tree-broadleaf','tree-pine','rabbit','bird'].entries()){const m=assets.make(id,id==='bird'?{width:2.8}:{height:id==='rabbit'?2:4.5});m.position.x=(i-1.5)*3;m.position.y=id==='bird'?2:0;group.add(m);}}controls.update();}
for(const id of ['ducks','scarf','audience','scenery'])document.getElementById(id).onclick=()=>view(id);view('ducks');function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}addEventListener('resize',resize);resize();renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
</script></html>
